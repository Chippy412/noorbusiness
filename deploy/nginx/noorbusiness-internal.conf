# deploy/nginx/noorbusiness-internal.conf
# Install to /etc/nginx/conf.d/noorbusiness-internal.conf (deploy.sh does).
#
# The database triggers notify_volunteers and request_geocode call the site
# over plain http on the Docker bridge address (172.17.0.1). Once certbot puts
# the HTTPS redirect on port 80, those calls got a 404 and no volunteer emails
# or map lookups ever ran. This server answers ONLY on that internal address,
# ONLY for the two hook paths, and hands them to the API wrapper. It is not
# reachable from the internet, and the public site config is untouched.
server {
  listen 172.17.0.1:80;
  server_name _;
  server_tokens off;

  location ~ ^/api/(notify|geocode)$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host noorbusiness.org;
    proxy_read_timeout 35s;
  }
  location / { return 404; }
}
