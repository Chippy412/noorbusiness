# Internal-only route for the Supabase database hooks (pg_net triggers
# notify_volunteers and request_geocode), which call http://172.17.0.1/api/...
# from inside Docker with Host: 172.17.0.1. Matched by that exact name, so
# certbot's port-80 redirect block (which answers anything else with 404)
# doesn't swallow these calls. It deliberately does not bind to the bridge
# address, so nginx still starts at boot before Docker creates docker0.
# Both endpoints check a bearer secret / moderator token themselves.
server {
  listen 80;
  listen [::]:80;
  server_name 172.17.0.1;

  location ~ ^/api/(notify|geocode)$ {
    proxy_pass http://noor_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 35s;
  }

  location / { return 404; }
}
