# deploy/nginx/noorbusiness.conf
# Nginx site for the self-hosted NICC Business on the masjid's Lightsail
# server. Install to /etc/nginx/conf.d/noorbusiness.conf (deploy/deploy.sh does).
#
#   static site      /var/www/noorbusiness            (copied by deploy.sh)
#   API wrapper      127.0.0.1:3000  server/index.js  (systemd: noorbusiness-api)
#   Supabase (Kong)  127.0.0.1:8000  self-hosted Supabase in Docker
#
# Supabase is served on the SAME origin (/rest/v1, /auth/v1, /storage/v1,
# /realtime/v1), so js/supabase-client.js points at the site's own address
# and the CSP needs no extra Supabase host.
#
# TLS: this file listens on 80 only. Once DNS for the final address points
# here, run:  sudo certbot --nginx -d noorbusiness.org -d www.noorbusiness.org
# certbot adds the 443 server and the redirect. Then uncomment the HSTS line.

upstream noor_api      { server 127.0.0.1:3000; keepalive 8; }
upstream noor_supabase { server 127.0.0.1:8000; keepalive 16; }

map $http_upgrade $noor_connection_upgrade { default upgrade; '' close; }

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name noorbusiness.org www.noorbusiness.org _;

  root /var/www/noorbusiness;
  index noor-business.html;
  charset utf-8;
  client_max_body_size 10m;   # listing photos go to /storage/v1
  server_tokens off;

  # Security headers (copied from vercel.json; Supabase is now same-origin).
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://$host https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Vercel rewrite: / -> /noor-business.html
  location = / { try_files /noor-business.html =404; }

  # Vercel rewrites: /b/<id> and /sitemap.xml go to the API wrapper, as does /api/*.
  location ~ ^/(api/|b/|sitemap\.xml$) {
    proxy_pass http://noor_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
  }

  # Self-hosted Supabase through Kong.
  location ~ ^/(rest|auth|storage|graphql)/v1/ {
    proxy_pass http://noor_supabase;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
  location /realtime/v1/ {
    proxy_pass http://noor_supabase;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $noor_connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /images/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~ /\. { deny all; }

  location / { try_files $uri =404; }
  error_page 404 /404.html;
}
