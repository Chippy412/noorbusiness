<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F8F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14180F" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Page not found | NICC Business</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@500;700&display=swap">
<style>
  :root {
    --sage: #C6D29B; --accent: #4C5F26; --accent-ink: #FFFFFF; --accent-soft: #EBF0DA; --accent-soft-ink: #38471A;
    --ink: #22271C; --muted: #5C6252; --ground: #F8F8F2; --surface: #FFFFFF; --hairline: #E2E4D4; --star: #C6D29B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #BACD82; --accent-ink: #161A0E; --accent-soft: rgba(186,205,130,0.15); --accent-soft-ink: #CFDDA5;
      --ink: #F0F2E6; --muted: #AEB5A0; --ground: #14180F; --surface: #1B2015; --hairline: #2F3624; --star: #3A4429;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background: var(--ground); color: var(--ink); font-family: "Manrope", system-ui, sans-serif; line-height: 1.55;
    overflow-x: hidden;
  }
  main { position: relative; width: min(560px, 100%); text-align: center; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  .stars { position: absolute; left: 50%; top: -150px; width: 420px; height: 420px; margin-left: -210px; z-index: -1; color: var(--star); opacity: 0.28; animation: spin-slow 90s linear infinite; }
  .code { font-family: "Bricolage Grotesque", Georgia, serif; font-weight: 700; font-size: clamp(5rem, 22vw, 8.5rem); line-height: 1; letter-spacing: -0.04em; color: var(--accent); }
  h1 { font-family: "Bricolage Grotesque", Georgia, serif; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.1rem); line-height: 1.15; margin-top: 12px; text-wrap: balance; }
  p { color: var(--muted); margin-top: 12px; text-wrap: pretty; }
  form { display: flex; gap: 8px; margin-top: 28px; padding: 6px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 999px; }
  input { flex: 1; min-width: 0; border: 0; background: none; padding: 0 16px; font: inherit; color: var(--ink); outline: none; }
  input::placeholder { color: var(--muted); }
  form:focus-within { border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.8em 1.4em; border-radius: 999px; border: 0; font: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer; text-decoration: none; background: var(--accent); color: var(--accent-ink); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.97); }
  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
  .pills a { padding: 8px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-soft-ink); font-size: 0.86rem; font-weight: 700; text-decoration: none; transition: transform 0.25s ease; }
  .pills a:hover { transform: translateY(-2px); }
  .home { display: inline-block; margin-top: 26px; color: var(--accent); font-weight: 700; text-decoration: none; }
  .home:hover { text-decoration: underline; text-underline-offset: 4px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { main, .stars { animation: none; } .btn, .pills a { transition: none; } }
</style>
</head>
<body>
<main>
  <svg class="stars" viewBox="0 0 100 100" aria-hidden="true"><path d="M20 20 H80 V80 H20 Z" fill="currentColor"/><path d="M50 8 L92 50 L50 92 L8 50 Z" fill="currentColor"/></svg>
  <div class="code" aria-hidden="true">404</div>
  <h1>We could not find that page.</h1>
  <p>The link may be old or mistyped. Search the directory, or jump to a category.</p>
  <form action="/" method="get" id="f" role="search">
    <input type="search" id="q" placeholder="What are you looking for?" aria-label="Search the directory" autocomplete="off">
    <button class="btn" type="submit">Search</button>
  </form>
  <nav class="pills" aria-label="Categories">
    <a href="/#/explore?cat=Restaurants">Restaurants</a>
    <a href="/#/explore?cat=Grocery">Grocery</a>
    <a href="/#/explore?cat=Modest%20Wear">Modest wear</a>
    <a href="/#/explore?cat=Education">Education</a>
    <a href="/#/explore?cat=Health%20%26%20Wellness">Health &amp; wellness</a>
  </nav>
  <a class="home" href="/">Back to the home page</a>
</main>
<script>
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    location.href = "/#/explore" + (q ? "?q=" + encodeURIComponent(q) : "");
  });
</script>
</body>
</html>
